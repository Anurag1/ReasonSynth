name: Missing Connection Engine Tests

on:
  push:
    paths:
      - "missing_connection_engine/**"
      - "tests/test_missing_connection_engine.py"
      - ".github/workflows/missing-connection-tests.yml"
  pull_request:
    paths:
      - "missing_connection_engine/**"
      - "tests/test_missing_connection_engine.py"
      - ".github/workflows/missing-connection-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_missing_connection_engine.py
