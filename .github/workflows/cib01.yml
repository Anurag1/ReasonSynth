name: CIB-01 Benchmark

on:
  push:
    paths:
      - "benchmarks/cib01_creator_intelligence/**"
      - ".github/workflows/cib01.yml"
  pull_request:
    paths:
      - "benchmarks/cib01_creator_intelligence/**"
      - ".github/workflows/cib01.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s benchmarks/cib01_creator_intelligence/tests -v
      - name: Benchmark
        run: python benchmarks/cib01_creator_intelligence/scripts/run_benchmark.py
