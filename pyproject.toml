[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unseen-contradiction-benchmark"
version = "0.1.0"
description = "Evidence-first graph-vs-text contradiction reasoning prototype"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
unseen = "unseen.cli:main"

[tool.setuptools.packages.find]
include = ["unseen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
